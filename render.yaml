services:
  - type: web
    name: vectra-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FOUNDER_EMAILS
        value: akhil718@gmail.com
      - key: GEMINI_API_KEY
        sync: false
      - key: VEO_MODEL
        value: veo-3.1-generate-preview
      - key: UPI_ID
        value: 7359777788@UPI
      - key: CORS_ORIGINS
        value: "*"
  - type: web
    name: vectra-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          name: vectra-backend
          type: web
          property: host
